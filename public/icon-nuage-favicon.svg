      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <text x="256" y="328" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="208" letter-spacing="-8" fill="#fff"
    text-anchor="middle">idée</text>
</svg>
